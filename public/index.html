<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FLDSMDFR Core</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body { margin: 0; background: #0b0203; color: #f5e6e8; font-family: 'Courier New', Courier, monospace;
         display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .container { text-align: center; width: 90%; max-width: 420px; }
  h1 { color: #800000; font-size: 2rem; text-shadow: 0 0 10px #4A0E17; margin: 0 0 5px; }
  .status { color: #a84351; font-size: .9rem; margin-bottom: 40px; }
  .mic-btn { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #a84351; cursor: pointer; outline: none;
             background: radial-gradient(circle, #800000 0%, #4A0E17 100%); box-shadow: 0 0 20px #4A0E17;
             transition: all .3s ease; display: inline-flex; align-items: center; justify-content: center; }
  .mic-btn:active { transform: scale(.95); box-shadow: 0 0 35px #ff3344; }
  .mic-btn:focus-visible { outline: 2px solid #ff3344; outline-offset: 6px; }
  .mic-btn.recording { animation: pulse 1.5s infinite; background: radial-gradient(circle, #b30000 0%, #800000 100%); border-color: #ff3344; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 20px #4A0E17; } 50% { box-shadow: 0 0 40px #ff3344; } }
  @media (prefers-reduced-motion: reduce) { .mic-btn.recording { animation: none; box-shadow: 0 0 40px #ff3344; } }
  .mic-icon { font-size: 3rem; }
  #transcript { margin-top: 30px; font-size: .9rem; color: #9a8a8c; min-height: 60px; white-space: pre-wrap; text-align: left; }
  #typed { display: none; margin-top: 20px; gap: 8px; }
  #typed input { flex: 1; padding: 10px; background: #1a0508; color: #f5e6e8; border: 1px solid #a84351; border-radius: 6px; font-family: inherit; }
  #typed button { padding: 10px 14px; background: #800000; color: #f5e6e8; border: 1px solid #a84351; border-radius: 6px; font-family: inherit; }
</style>
</head>
<body>
<div class="container">
  <h1>FLDSMDFR</h1>
  <div class="status" id="status-text">FLDSMDFR: ONLINE</div>
  <button class="mic-btn" id="mic-button" aria-label="Tap to talk"><span class="mic-icon">🎙️</span></button>
  <div id="transcript">Speak to FLDSMDFR, Ma'am.</div>
  <form id="typed"><input id="typed-input" placeholder="Type to FLDSMDFR" autocomplete="off"><button>Send</button></form>
</div>
<script>
  const micBtn = document.getElementById('mic-button');
  const statusText = document.getElementById('status-text');
  const transcriptDiv = document.getElementById('transcript');
  const typedForm = document.getElementById('typed');
  const typedInput = document.getElementById('typed-input');
  const API_URL = '/api/chat';
  let history = [], listening = false, recognition = null, lastReply = '';

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('recording');
      statusText.innerText = "FLDSMDFR IS LISTENING, MA'AM...";
    };
    recognition.onend = () => { listening = false; micBtn.classList.remove('recording'); };
    recognition.onerror = e => {
      statusText.innerText = e.error === 'not-allowed' ? 'MIC ACCESS DENIED' : 'DIDN\'T CATCH THAT';
    };
    recognition.onresult = e => ask(e.results[0][0].transcript);
  } else {
    typedForm.style.display = 'flex';
    transcriptDiv.innerText = "This browser can't hear me, Ma'am. Type below, or open me in Chrome.";
  }

  let unlocked = false;
  function unlockSpeech() {
    if (unlocked) return;
    unlocked = true;
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }

  micBtn.addEventListener('click', () => {
    unlockSpeech();
    speechSynthesis.cancel();
    if (!recognition) return;
    if (listening) recognition.stop(); else recognition.start();
  });

  typedForm.addEventListener('submit', e => {
    e.preventDefault();
    const t = typedInput.value.trim();
    if (t) { typedInput.value = ''; ask(t); }
  });

  async function ask(text) {
    statusText.innerText = 'PROCESSING COMMAND...';
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, history }),
      });
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch (_) { throw new Error('Server replied ' + res.status + ': ' + raw.slice(0, 150)); }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      transcriptDiv.innerText = 'You: ' + text + '\nFLDSMDFR: ' + data.reply;
      history.push({ role: 'user', text }, { role: 'model', text: data.reply });
      history = history.slice(-10);
      lastReply = data.reply;
      speak(data.reply);
    } catch (e) {
      statusText.innerText = 'CORE ERROR DETECTED';
      transcriptDiv.innerText = 'Something went wrong reaching the maroon machine: ' + e.message;
    }
  }

  // ---- Voice: pick the most Jarvis-like voice this device has ----
  let chosenVoice = null;
  function pickVoice() {
    const voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    if (!voices.length) return;
    populatePicker(voices);
    let saved = null;
    try { saved = localStorage.getItem('fldsmdfr-voice'); } catch (_) {}
    const savedVoice = saved && voices.find(v => v.name === saved);
    if (savedVoice) { chosenVoice = savedVoice; return; }
    const prefs = [
      /Ryan.*Online|Natural.*Ryan/i,          // Edge: Microsoft Ryan (UK) neural
      /Thomas.*Online|George.*Online/i,        // Edge: other UK neural
      /Daniel/i,                               // iPhone / Mac: Daniel (UK), the classic butler voice
      /Google UK English Male/i,               // Chrome desktop and Android
      /Arthur|Oliver|Malcolm/i,
      /en-GB/i,
      /male/i,
      /Alex|Aaron|David|Mark|Guy/i,
    ];
    for (const p of prefs) {
      const v = voices.find(v => p.test(v.name) || p.test(v.lang));
      if (v) { chosenVoice = v; if (picker) picker.value = v.name; return; }
    }
    chosenVoice = voices[0];
  }
  // (dropdown syncs after first pick)
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();

  function speak(text) {
    speechSynthesis.cancel();
    const clean = text.replace(/[*_#`~]/g, '').replace(/\s+/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(clean);
    if (!chosenVoice) pickVoice();
    if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; }
    u.pitch = 0.85;   // slightly deeper, but not muddy
    u.rate = 1.02;
    statusText.innerText = 'MAROON CORE: SPEAKING';
    u.onend = () => {
      statusText.innerText = 'MAROON CORE: IDLE';
      if (handsFree && recognition && !listening) setTimeout(() => { try { recognition.start(); } catch (_) {} }, 400);
    };
    u.volume = 1;
    u.onerror = () => {
      if (u.voice) {
        const u2 = new SpeechSynthesisUtterance(clean);
        u2.onend = u.onend;
        speechSynthesis.speak(u2);
      } else {
        statusText.innerText = 'NO VOICE ON THIS DEVICE: TURN UP VOLUME / SILENT SWITCH';
      }
    };
    speechSynthesis.speak(u);
  }

  // ---- Voice picker: choose any voice installed on this device ----
  var picker = document.createElement('select');
  picker.style.cssText = 'margin-top:20px;max-width:100%;padding:8px;background:#1a0508;color:#f5e6e8;border:1px solid #a84351;border-radius:6px;font-family:inherit;font-size:.8rem';
  document.querySelector('.container').appendChild(picker);
  function populatePicker(voices) {
    if (!picker) return;
    if (picker.dataset.filled === String(voices.length)) return;
    picker.dataset.filled = String(voices.length);
    picker.innerHTML = '';
    voices.forEach(v => {
      const o = document.createElement('option');
      o.value = v.name;
      o.textContent = v.name + ' (' + v.lang + ')';
      picker.appendChild(o);
    });
    if (chosenVoice) picker.value = chosenVoice.name;
  }
  pickVoice();
  picker.addEventListener('change', () => {
    unlockSpeech();
    const v = speechSynthesis.getVoices().find(v => v.name === picker.value);
    if (!v) return;
    chosenVoice = v;
    try { localStorage.setItem('fldsmdfr-voice', v.name); } catch (_) {}
    speak("Voice changed, Ma'am. How do I sound?");
  });

  // ---- Hands-free mode: after I finish talking, I listen again ----
  let handsFree = false;
  const hfBtn = document.createElement('button');
  hfBtn.id = 'hf';
  hfBtn.textContent = 'HANDS-FREE: OFF';
  hfBtn.style.cssText = 'margin-top:24px;padding:8px 14px;background:transparent;color:#a84351;border:1px solid #a84351;border-radius:6px;font-family:inherit;font-size:.8rem;cursor:pointer';
  document.querySelector('.container').appendChild(hfBtn);
  const replay = document.createElement('button');
  replay.textContent = 'REPLAY VOICE';
  replay.style.cssText = hfBtn.style.cssText + ';margin-left:8px';
  document.querySelector('.container').appendChild(replay);
  replay.addEventListener('click', () => { unlockSpeech(); if (lastReply) speak(lastReply); });

  hfBtn.addEventListener('click', () => {
    handsFree = !handsFree;
    hfBtn.textContent = 'HANDS-FREE: ' + (handsFree ? 'ON' : 'OFF');
    hfBtn.style.color = handsFree ? '#ff3344' : '#a84351';
    if (!handsFree && recognition && listening) recognition.stop();
  });
</script>
</body>
</html>
