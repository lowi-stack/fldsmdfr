<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FLDSMDFR Core</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body { margin: 0; background: #0b0203; color: #f5e6e8; font-family: 'Courier New', Courier, monospace;
         display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .container { text-align: center; width: 90%; max-width: 420px; }
  h1 { color: #800000; font-size: 2rem; text-shadow: 0 0 10px #4A0E17; margin: 0 0 5px; }
  .status { color: #a84351; font-size: .9rem; margin-bottom: 40px; }
  .mic-btn { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #a84351; cursor: pointer; outline: none;
             background: radial-gradient(circle, #800000 0%, #4A0E17 100%); box-shadow: 0 0 20px #4A0E17;
             transition: all .3s ease; display: inline-flex; align-items: center; justify-content: center; }
  .mic-btn:active { transform: scale(.95); box-shadow: 0 0 35px #ff3344; }
  .mic-btn:focus-visible { outline: 2px solid #ff3344; outline-offset: 6px; }
  .mic-btn.recording { animation: pulse 1.5s infinite; background: radial-gradient(circle, #b30000 0%, #800000 100%); border-color: #ff3344; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 20px #4A0E17; } 50% { box-shadow: 0 0 40px #ff3344; } }
  @media (prefers-reduced-motion: reduce) { .mic-btn.recording { animation: none; box-shadow: 0 0 40px #ff3344; } }
  .mic-icon { font-size: 3rem; }
  #transcript { margin-top: 30px; font-size: .9rem; color: #9a8a8c; min-height: 60px; white-space: pre-wrap; text-align: left; }
  #typed { display: none; margin-top: 20px; gap: 8px; }
  #typed input { flex: 1; padding: 10px; background: #1a0508; color: #f5e6e8; border: 1px solid #a84351; border-radius: 6px; font-family: inherit; }
  #typed button { padding: 10px 14px; background: #800000; color: #f5e6e8; border: 1px solid #a84351; border-radius: 6px; font-family: inherit; }
</style>
</head>
<body>
<div class="container">
  <h1>FLDSMDFR</h1>
  <div class="status" id="status-text">MAROON CORE: ONLINE</div>
  <button class="mic-btn" id="mic-button" aria-label="Tap to talk"><span class="mic-icon">🎙️</span></button>
  <div id="transcript">Tap the orb and speak to FLDSMDFR, Ma'am.</div>
  <form id="typed"><input id="typed-input" placeholder="Type to FLDSMDFR" autocomplete="off"><button>Send</button></form>
</div>
<script>
  const micBtn = document.getElementById('mic-button');
  const statusText = document.getElementById('status-text');
  const transcriptDiv = document.getElementById('transcript');
  const typedForm = document.getElementById('typed');
  const typedInput = document.getElementById('typed-input');
  const API_URL = '/api/chat';
  let history = [], listening = false, recognition = null;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('recording');
      statusText.innerText = "FLDSMDFR IS LISTENING, MA'AM...";
    };
    recognition.onend = () => { listening = false; micBtn.classList.remove('recording'); };
    recognition.onerror = e => {
      statusText.innerText = e.error === 'not-allowed' ? 'MIC ACCESS DENIED' : 'DIDN\'T CATCH THAT';
    };
    recognition.onresult = e => ask(e.results[0][0].transcript);
  } else {
    typedForm.style.display = 'flex';
    transcriptDiv.innerText = "This browser can't hear me, Ma'am. Type below, or open me in Chrome.";
  }

  micBtn.addEventListener('click', () => {
    speechSynthesis.cancel();
    if (!recognition) return;
    if (listening) recognition.stop(); else recognition.start();
  });

  typedForm.addEventListener('submit', e => {
    e.preventDefault();
    const t = typedInput.value.trim();
    if (t) { typedInput.value = ''; ask(t); }
  });

  async function ask(text) {
    statusText.innerText = 'PROCESSING COMMAND...';
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, history }),
      });
      const raw = await res.text();
      let data;
      try { data = JSON.parse(raw); } catch (_) { throw new Error('Server replied ' + res.status + ': ' + raw.slice(0, 150)); }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      transcriptDiv.innerText = 'You: ' + text + '\nFLDSMDFR: ' + data.reply;
      history.push({ role: 'user', text }, { role: 'model', text: data.reply });
      history = history.slice(-10);
      speak(data.reply);
    } catch (e) {
      statusText.innerText = 'CORE ERROR DETECTED';
      transcriptDiv.innerText = 'Something went wrong reaching the maroon machine: ' + e.message;
    }
  }

  function speak(text) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = 0.6;
    u.rate = 0.95;
    const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    const deep = voices.find(v => /male|daniel|david|google uk english male/i.test(v.name));
    if (deep) u.voice = deep;
    statusText.innerText = 'MAROON CORE: SPEAKING';
    u.onend = () => { statusText.innerText = 'MAROON CORE: IDLE'; };
    speechSynthesis.speak(u);
  }
</script>
</body>
</html>
