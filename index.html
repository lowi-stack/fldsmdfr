<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FLDSMDFR Core</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body { margin: 0; background: #0b0203; color: #f5e6e8; font-family: 'Courier New', Courier, monospace;
         display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .container { text-align: center; width: 90%; max-width: 420px; }
  h1 { color: #800000; font-size: 2rem; text-shadow: 0 0 10px #4A0E17; margin: 0 0 5px; }
  .status { color: #a84351; font-size: .9rem; margin-bottom: 40px; }
  .mic-btn { width: 140px; height: 140px; border-radius: 50%; border: 3px solid #a84351; cursor: pointer; outline: none;
             background: radial-gradient(circle, #800000 0%, #4A0E17 100%); box-shadow: 0 0 20px #4A0E17;
             transition: all .3s ease; display: inline-flex; align-items: center; justify-content: center; }
  .mic-btn:active { transform: scale(.95); box-shadow: 0 0 35px #ff3344; }
  .mic-btn:focus-visible { outline: 2px solid #ff3344; outline-offset: 6px; }
  .mic-btn.recording { animation: pulse 1.5s infinite; background: radial-gradient(circle, #b30000 0%, #800000 100%); border-color: #ff3344; }
  .mic-btn:disabled { opacity: .6; cursor: wait; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 20px #4A0E17; } 50% { box-shadow: 0 0 40px #ff3344; } }
  @media (prefers-reduced-motion: reduce) { .mic-btn.recording { animation: none; box-shadow: 0 0 40px #ff3344; } }
  .mic-icon { font-size: 3rem; }
  #transcript { margin-top: 30px; font-size: .9rem; color: #9a8a8c; min-height: 40px; white-space: pre-wrap; text-align: left; }
</style>
</head>
<body>
<div class="container">
  <h1>FLDSMDFR</h1>
  <div class="status" id="status-text">MAROON CORE: ONLINE</div>
  <button class="mic-btn" id="mic-button" aria-label="Tap to talk"><span class="mic-icon">🎙️</span></button>
  <div id="transcript">Tap the orb and speak to FLDSMDFR, Ma'am.</div>
</div>
<script>
  const micBtn = document.getElementById('mic-button');
  const statusText = document.getElementById('status-text');
  const transcriptDiv = document.getElementById('transcript');
  const API_URL = '/api/jarvis'; // change to your full backend URL if the page is hosted elsewhere
  let recorder, chunks = [], history = [], mimeType = '';

  function pickMime() {
    for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4']) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
    }
    return '';
  }

  micBtn.addEventListener('click', async () => {
    if (recorder && recorder.state === 'recording') {
      recorder.stop();
      micBtn.classList.remove('recording');
      micBtn.disabled = true;
      statusText.innerText = 'PROCESSING COMMAND...';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mimeType = pickMime();
      recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        send(new Blob(chunks, { type: recorder.mimeType || mimeType }));
      };
      recorder.start();
      micBtn.classList.add('recording');
      statusText.innerText = "FLDSMDFR IS LISTENING, MA'AM...";
    } catch (err) {
      statusText.innerText = 'MIC ACCESS DENIED';
      transcriptDiv.innerText = 'Allow microphone access in your browser settings and use https or localhost.';
    }
  });

  async function send(blob) {
    const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
    const form = new FormData();
    form.append('audio', blob, 'speech.' + ext);
    form.append('history', JSON.stringify(history));
    try {
      const res = await fetch(API_URL, { method: 'POST', body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      transcriptDiv.innerText = 'You: ' + data.input + '\nFLDSMDFR: ' + data.reply;
      history.push({ role: 'user', content: data.input }, { role: 'assistant', content: data.reply });
      history = history.slice(-10);
      statusText.innerText = 'MAROON CORE: SPEAKING';
      const audio = new Audio('data:audio/mp3;base64,' + data.audioBase64);
      audio.onended = () => { statusText.innerText = 'MAROON CORE: IDLE'; };
      await audio.play().catch(() => { statusText.innerText = 'MAROON CORE: IDLE'; });
    } catch (e) {
      statusText.innerText = 'CORE ERROR DETECTED';
      transcriptDiv.innerText = 'Something went wrong reaching the maroon machine: ' + e.message;
    } finally {
      micBtn.disabled = false;
    }
  }
</script>
</body>
</html>
